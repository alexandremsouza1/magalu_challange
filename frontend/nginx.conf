server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Garante SPA routing — React Router / Vite
  location / {
    try_files $uri /index.html;
  }

  # Cache estático básico
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, no-transform";
  }
}
