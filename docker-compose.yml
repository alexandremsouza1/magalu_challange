version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env 